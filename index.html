<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Guia Farmaceutica HEMA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#EEECEB;color:#1A1917;min-height:100vh}
.frame{max-width:1300px;margin:20px auto;background:#fff;border:1px solid #D8D5CE;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}
header{background:#3A3A38;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.hl{display:flex;align-items:center;gap:12px}
.lw{background:#fff;border-radius:6px;padding:4px 8px;display:flex;align-items:center}
.lw img{height:32px;width:auto}
.hd{width:1px;height:28px;background:rgba(255,255,255,.3)}
.ht{font-size:15px;font-weight:700}
.hs{font-size:10px;color:rgba(255,255,255,.6);margin-top:2px}
.hdate{font-size:11px;color:#fff;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px}
.toolbar{background:#fff;border-bottom:1px solid #D8D5CE;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:3px;background:#DEDAD4;padding:3px;border-radius:8px}
.tab{padding:6px 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:#888780}
.tab.active{background:#1B4F8A;color:#fff}
.sw{position:relative;flex:1;min-width:180px}
.search{width:100%;padding:8px 12px 8px 34px;border:1px solid #D8D5CE;border-radius:8px;font-size:13px;background:#EEECEB;color:#1A1917;outline:none}
.search:focus{border-color:#9AAAB8;background:#fff}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#888780;font-size:14px;pointer-events:none}
.layout{display:flex;min-height:500px}
.sidebar{width:220px;background:#F5F4F0;border-right:1px solid #D8D5CE;overflow-y:auto;flex-shrink:0;padding:8px 6px}
.slabel{padding:8px 8px 4px;font-size:10px;font-weight:700;color:#1B4F8A;letter-spacing:.1em;text-transform:uppercase;border-top:1px solid #D8D5CE;margin-top:6px}
.slabel:first-child{border-top:none;margin-top:0}
.citem{padding:7px 10px;font-size:12px;color:#444441;border-radius:6px;cursor:pointer;margin-bottom:1px}
.citem:hover{background:#E0DDD7}
.citem.active{background:#1B4F8A;color:#fff;font-weight:500}
.main{flex:1;overflow:auto}
.statsbar{padding:7px 14px;background:#E0DDD7;border-bottom:1px solid #D8D5CE;font-size:12px;color:#888780}
.statsbar strong{color:#1A1917}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#888780;border-bottom:2px solid #D8D5CE;background:#E0DDD7;white-space:nowrap;cursor:pointer;position:sticky;top:0}
thead th:hover{color:#1A1917}
tbody tr{border-bottom:1px solid #EAE7E0}
tbody tr:hover{background:#F4F2EE}
td{padding:10px 14px;vertical-align:middle}
.mn{font-weight:600;color:#1A1917}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.bs{background:#D3F4E4;color:#0A5C35}
.bn{background:#FFE8E8;color:#8B1A1A}
.cc{font-size:11px;color:#1B4F8A;background:#E3EDF8;padding:2px 8px;border-radius:5px;cursor:pointer;border:1px solid #B5D4F4;display:inline-block}
.cc:hover{background:#1B4F8A;color:#fff}
.gt{font-size:11px;color:#444441;background:#E8E5DF;padding:2px 8px;border-radius:5px;display:inline-block;border:1px solid #D8D5CE;cursor:pointer}
.gt:hover{background:#2C2C2A;color:#fff}
.empty{text-align:center;padding:3rem;color:#888780}
mark{background:#FFF3B0;color:#1A1917;border-radius:2px}
footer{text-align:center;padding:10px;font-size:11px;color:#888780;background:#E0DDD7;border-top:1px solid #D8D5CE}
@media(max-width:650px){.sidebar{display:none}.frame{margin:0;border-radius:0}}
</style>
</head>

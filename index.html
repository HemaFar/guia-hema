<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Guia Farmaceutica HEMA</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",Arial,sans-serif;background:#F0EFED;color:#1A1917;min-height:100vh}
.frame{max-width:1300px;margin:20px auto;background:#fff;border:1px solid #D8D5CE;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.1)}
header{background:linear-gradient(135deg,#2C2C2A 0%,#444441 100%);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:70px}
.hl{display:flex;align-items:center;gap:14px}
.lw{background:#fff;border-radius:8px;padding:5px 10px;display:flex;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.lw img{height:34px;width:auto}
.hd{width:1px;height:30px;background:rgba(255,255,255,.25)}
.ht{font-size:16px;font-weight:700;letter-spacing:-.01em}
.hs{font-size:10px;color:rgba(255,255,255,.55);margin-top:2px;letter-spacing:.08em}
.hdate{font-size:11px;font-weight:500;color:#fff;background:rgba(255,255,255,.12);padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.2)}
.toolbar{background:#fff;border-bottom:1px solid #E8E5DF;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:3px;background:#F0EFED;padding:4px;border-radius:10px}
.tab{padding:7px 20px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:transparent;color:#888780;font-family:"Inter",sans-serif;transition:all .15s}
.tab.active{background:#1B4F8A;color:#fff;box-shadow:0 2px 8px rgba(27,79,138,.25)}
.sw{position:relative;flex:1;min-width:200px}
.search{width:100%;padding:9px 14px 9px 36px;border:1.5px solid #E0DDD7;border-radius:10px;font-size:13px;font-family:"Inter",sans-serif;background:#F8F7F5;color:#1A1917;outline:none;transition:all .15s}
.search:focus{border-color:#1B4F8A;background:#fff;box-shadow:0 0 0 3px rgba(27,79,138,.08)}
.search::placeholder{color:#AAAAA8}
.si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#AAAAA8;font-size:15px;pointer-events:none}
.layout{display:flex;min-height:520px}
.sidebar{width:250px;background:#F8F7F5;border-right:1px solid #E8E5DF;overflow-y:auto;flex-shrink:0;padding:10px 0}
.s-reset{display:flex;align-items:center;gap:6px;margin:0 10px 10px;padding:7px 12px;font-size:12px;font-weight:600;background:#1B4F8A;color:#fff;border:none;border-radius:8px;cursor:pointer;width:calc(100% - 20px)}
.s-reset:hover{background:#163d6e}
.n1-header{padding:9px 14px;font-size:11px;font-weight:700;color:#1A1917;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:#EEECEA;border-bottom:1px solid #E0DDD7;user-select:none;letter-spacing:.04em;text-transform:uppercase}
.n1-header:hover{background:#E5E2DC}
.n1-header.active{background:#1B4F8A;color:#fff}
.n1-arrow{font-size:9px;opacity:.6;transition:transform .2s}
.n1-arrow.open{transform:rotate(90deg)}
.n1-body{display:none}
.n1-body.open{display:block}
.n2-header{padding:7px 14px 7px 20px;font-size:11px;font-weight:600;color:#555;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none}
.n2-header:hover{background:#EEE}
.n2-header.active{color:#1B4F8A}
.n2-arrow{font-size:9px;opacity:.5;transition:transform .2s}
.n2-arrow.open{transform:rotate(90deg)}
.n2-body{display:none}
.n2-body.open{display:block}
.n3-item{padding:5px 14px 5px 28px;font-size:11px;color:#777;cursor:pointer;border-left:2px solid transparent;transition:all .12s}
.n3-item:hover{background:#E8E5DF;border-left-color:#9AAAB8;color:#333}
.n3-item.active{background:#E3EDF8;color:#1B4F8A;font-weight:600;border-left-color:#1B4F8A}
.main{flex:1;overflow:auto}
.statsbar{padding:8px 18px;background:#F0EFED;border-bottom:1px solid #E8E5DF;font-size:12px;color:#888780;display:flex;align-items:center;gap:6px}
.statsbar strong{color:#1A1917}
.dot{width:6px;height:6px;border-radius:50%;background:#1B4F8A;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:10px 16px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#888780;border-bottom:2px solid #E8E5DF;background:#F5F4F0;white-space:nowrap;cursor:pointer;position:sticky;top:0}
thead th:hover{color:#1A1917}
tbody tr{border-bottom:1px solid #F0EFED;transition:background .1s}
tbody tr:hover{background:#F8F7F5}
td{padding:11px 16px;vertical-align:middle}
.mn{font-weight:600;color:#1A1917;font-size:13px}
.atc1-badge{font-size:11px;color:#444441;background:#E8E5DF;padding:3px 10px;border-radius:20px;font-weight:500;display:inline-block;border:1px solid #D8D5CE}
.atc3-badge{font-size:11px;color:#1B4F8A;background:#E8F0FB;padding:3px 10px;border-radius:20px;font-weight:500;display:inline-block;border:1px solid #C5D8F5}
.empty{text-align:center;padding:4rem;color:#AAAAA8}
.empty h3{font-size:16px;margin-bottom:6px;color:#888}
mark{background:#FFF3B0;color:#1A1917;border-radius:2px;padding:0 1px}
footer{text-align:center;padding:12px;font-size:11px;color:#AAAAA8;background:#F5F4F0;border-top:1px solid #E8E5DF}
@media(max-width:700px){.sidebar{display:none}.frame{margin:0;border-radius:0}}
</style>
</head>

    tr.appendChild(th);
  });
  applyFilters();
}

function applyFilters(){
  var rows=DATA[SHEETS[idx]],q=document.getElementById("search").value.toLowerCase().trim();
  var filtered=rows.filter(function(r){
    var mq=!q||Object.values(r).some(function(v){return String(v).toLowerCase().indexOf(q)>=0;});
    return mq&&(!f1||r["ATC Nivel 1"]===f1)&&(!f2||r["ATC Nivel 2"]===f2)&&(!f3||r["ATC Nivel 3"]===f3);
  });
  filtered.sort(function(a,b){
    var k=["Nombre guía","ATC Nivel 1"][sc]||"Nombre guía";
    return String(a[k]||"").localeCompare(String(b[k]||""))*sd;
  });
  document.querySelectorAll("#thead th").forEach(function(th,i){
    var cols=["Nombre guía","ATC Nivel 1"];
    th.textContent=cols[i]+(i===sc?(sd===1?" ↑":" ↓"):" ↕");
    (function(col){th.onclick=function(){if(sc===col)sd*=-1;else{sc=col;sd=1;}applyFilters();};})(i);
  });
  document.getElementById("stats").innerHTML="Mostrando <strong>"+filtered.length+"</strong> de <strong>"+DATA[SHEETS[idx]].length+"</strong> medicamentos";
  var tbody=document.getElementById("tbody");tbody.innerHTML="";
  if(!filtered.length){document.getElementById("empty").style.display="block";return;}
  document.getElementById("empty").style.display="none";
  filtered.forEach(function(row){
    var tr=document.createElement("tr");
    var td0=document.createElement("td");
    td0.innerHTML="<span class='mn'>"+hl(row["Nombre guía"]||"",q)+"</span>";
    tr.appendChild(td0);
    var td1=document.createElement("td");
    td1.innerHTML="<span class='atc1-badge'>"+hl(row["ATC Nivel 1"]||"",q)+"</span>";
    tr.appendChild(td1);
    tbody.appendChild(tr);
  });
}

function hl(t,q){if(!q)return t;return t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");}
buildTree();renderTable();
</script>
</body>
</html>

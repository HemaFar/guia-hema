<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrega de Turno · Farmacia</title>
<style>
  :root{
    --ink:#263340;
    --paper:#eceef1;
    --card:#ffffff;
    --line:#d3d8de;
    --accent:#2563a8;
    --accent-soft:#e2ebf5;
    --amber:#b8722a;
    --danger:#a8322d;
    --muted:#5c6570;
    --wa:#128c4b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    line-height:1.4;
    padding:0 0 120px;
  }
  header{
    background:var(--ink);
    color:var(--paper);
    padding:20px 18px 22px;
    border-bottom:3px solid var(--accent);
  }
  header .header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  header .header-text{flex:1;min-width:0}
  header .logo-box{
    background:#fff;
    border-radius:10px;
    padding:9px 12px;
    display:block;
    flex:0 0 auto;
  }
  header .logo-box img{
    display:block;
    height:38px;
    width:auto;
  }
  header .kicker{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#a8c2e0;
    margin:0 0 4px;
    font-weight:600;
  }
  header h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  header p{
    margin:6px 0 0;
    font-size:13px;
    color:#b7c4d3;
  }
  .wrap{max-width:620px;margin:0 auto;padding:16px 14px}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 14px;
    margin-bottom:14px;
  }
  .card h2{
    margin:0 0 12px;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  .card h2 .num{
    background:var(--accent);color:#fff;
    width:20px;height:20px;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    margin:0 0 5px;
  }
  .field{margin-bottom:12px}
  input[type=text],input[type=date],input[type=number],textarea,select{
    width:100%;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    background:#f5f7f9;
    border:1px solid var(--line);
    border-radius:9px;
    padding:11px 12px;
    outline:none;
  }
  input:focus,textarea:focus,select:focus{
    border-color:var(--accent);
    background:#fff;
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  textarea{resize:vertical;min-height:44px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .seg{display:flex;flex-wrap:wrap;gap:7px}
  .seg button{
    flex:1 1 45%;
    font-size:13px;font-weight:600;
    padding:10px 8px;
    border:1px solid var(--line);
    background:#f5f7f9;color:var(--muted);
    border-radius:9px;cursor:pointer;
    transition:.12s;
  }
  .seg button.on{
    background:var(--accent);color:#fff;border-color:var(--accent);
  }
  .toggle{display:flex;gap:8px}
  .toggle button{
    flex:1;font-size:14px;font-weight:600;
    padding:10px;border:1px solid var(--line);
    background:#f5f7f9;color:var(--muted);
    border-radius:9px;cursor:pointer;
  }
  .toggle button.no{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .toggle button.yes{background:#f6e6df;color:var(--amber);border-color:var(--amber)}
  .hint{font-size:11px;color:var(--muted);margin:4px 0 0}
  .inv-item{
    display:flex;align-items:center;gap:10px;
    padding:7px 0;border-bottom:1px dashed var(--line);
  }
  .inv-item:last-child{border-bottom:none}
  .inv-item span{flex:1;font-size:13px;font-weight:500}
  .inv-item input{width:64px;text-align:center;padding:8px 4px}
  .hidden{display:none}
  .pat-row{
    display:flex;gap:8px;align-items:flex-start;
    padding:10px 0;border-bottom:1px dashed var(--line);
  }
  .pat-row:last-of-type{border-bottom:none}
  .pat-row .cama{flex:0 0 70px}
  .pat-row .nombre{flex:1}
  .pat-fields{flex:1;display:flex;flex-direction:column;gap:7px}
  .pat-top{display:flex;gap:8px}
  .pat-row .del{
    flex:0 0 34px;height:40px;border:1px solid var(--line);
    background:#f5f7f9;color:var(--danger);border-radius:9px;
    font-size:18px;cursor:pointer;line-height:1;
  }
  .add-btn{
    width:100%;margin-top:10px;padding:11px;
    border:1px dashed var(--accent);background:var(--accent-soft);
    color:var(--accent);font-weight:700;font-size:14px;
    border-radius:9px;cursor:pointer;
  }
  .pat-empty{font-size:13px;color:var(--muted);padding:6px 0}
  .sub-grupo{
    font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent);margin:16px 0 6px;
  }
  .sub-sec{
    border:1px solid var(--line);border-radius:10px;
    padding:10px;margin-bottom:10px;background:#fafbfc;
  }
  .sub-title{
    font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;
  }
  .status{flex:1;min-width:0}
  .fact-toggle{display:flex;gap:5px;flex:0 0 auto}
  .factbtn{
    font-size:12px;font-weight:600;padding:8px 9px;
    border:1px solid var(--line);background:#f5f7f9;color:var(--muted);
    border-radius:8px;cursor:pointer;white-space:nowrap;
  }
  .factbtn.on-yes{background:#e2ebf5;color:var(--accent);border-color:var(--accent)}
  .factbtn.on-no{background:#f0eeea;color:var(--muted);border-color:var(--muted)}
  .fact-warn{
    font-size:12px;font-weight:600;color:var(--amber);
    background:#f6ede1;border:1px solid #e6c9a3;
    border-radius:8px;padding:7px 9px;margin-top:2px;
  }
  .fab{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(#eceef1cc,#eceef1);
    padding:12px 14px 16px;
    backdrop-filter:blur(4px);
  }
  .fab .inner{max-width:620px;margin:0 auto;display:flex;gap:10px}
  .fab button{
    flex:1;font-size:15px;font-weight:700;
    padding:15px;border-radius:12px;border:none;cursor:pointer;
  }
  #copyBtn{background:var(--wa);color:#fff}
  #resetBtn{flex:0 0 52px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:20px}
  .toast{
    position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;
    font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .preview{
    background:#263340;color:#d6e0ea;
    border-radius:12px;padding:14px;margin-top:4px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12.5px;white-space:pre-wrap;line-height:1.5;
    max-height:280px;overflow:auto;
  }
  details summary{
    cursor:pointer;font-size:12px;font-weight:700;color:var(--accent);
    letter-spacing:.08em;text-transform:uppercase;list-style:none;padding:4px 0;
  }
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸ ";}
  details[open] summary::before{content:"▾ ";}
</style>
</head>

<div class="wrap">

  <div class="card">
    <h2><span class="num">1</span> Área y turno</h2>
    <div class="field">
      <label>Farmacia / Área</label>
      <div class="seg" id="areaSeg">
        <button data-area="Emergencia">Emergencia</button>
        <button data-area="UCI Adulto">UCI Adulto</button>
        <button data-area="Cirugía">Cirugía</button>
        <button data-area="Servicio Farmacéutico Central">Serv. Farm. Central</button>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="fecha">
      </div>
      <div class="field">
        <label>Horario</label>
        <div class="toggle" id="horarioSeg">
          <button type="button" data-h="7:00am - 7:00pm">7am - 7pm</button>
          <button type="button" data-h="7:00pm - 7:00am">7pm - 7am</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>Entrega turno</label>
      <input type="text" id="entregaPersona" placeholder="Nombre y apellido">
    </div>
  </div>

  <div class="card">
    <h2><span class="num">2</span> Cadena de frío</h2>
    <div class="row">
      <div class="field">
        <label id="lblNevera1">Nevera</label>
        <input type="text" id="tNevera" placeholder="4.8" inputmode="decimal">
      </div>
      <div class="field" id="fldNevera2" style="display:none">
        <label>Nevera Central</label>
        <input type="text" id="tNevera2" placeholder="4.9" inputmode="decimal">
      </div>
      <div class="field" id="fldNevera3" style="display:none">
        <label>Nevera 3</label>
        <input type="text" id="tNevera3" placeholder="5.0" inputmode="decimal">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Área °C</label>
        <input type="text" id="tArea" placeholder="21.4" inputmode="decimal">
      </div>
      <div class="field">
        <label>Humedad</label>
        <input type="text" id="humedad" placeholder="58" inputmode="decimal">
      </div>
    </div>
  </div>

  <div class="card" id="patCard">
    <h2><span class="num">3</span> Pacientes</h2>
    <div id="patList"></div>
    <button type="button" id="addPat" class="add-btn">+ Agregar paciente</button>
    <div id="centralSubs" style="display:none"></div>
  </div>

  <div class="card">
    <h2><span class="num">4</span> Novedades</h2>
    <div class="field">
      <label>Pre-alta (no realizar cargos)</label>
      <div class="toggle" data-toggle="prealta">
        <button data-val="No" class="no">No</button>
        <button data-val="Sí">Sí</button>
      </div>
      <div id="prealtaBox" class="hidden">
        <div id="prealtaList"></div>
        <button type="button" id="addPrealta" class="add-btn">+ Agregar paciente</button>
      </div>
    </div>
    <div class="field">
      <label>Pendientes por cargos</label>
      <div class="toggle" data-toggle="cargos">
        <button data-val="No" class="no">No</button>
        <button data-val="Sí">Sí</button>
      </div>
      <div id="cargosBox" class="hidden">
        <div id="cargoList"></div>
        <button type="button" id="addCargo" class="add-btn">+ Agregar pendiente</button>
      </div>
    </div>
    <div class="field">
      <label>Eventualidades</label>
      <div class="toggle" data-toggle="event">
        <button data-val="No" class="no">No</button>
        <button data-val="Sí">Sí</button>
      </div>
      <textarea id="eventDetalle" class="hidden" placeholder="Detalle de la eventualidad..."></textarea>
    </div>
  </div>

  <div class="card" id="invCard">
    <h2><span class="num">6</span> Inventario Consignados <span style="color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0">· solo Cirugía</span></h2>
    <div id="invList"></div>
  </div>

  <div class="card" id="invEmergCard" style="display:none">
    <h2><span class="num">6</span> Inventario Físico</h2>
    <div id="invEmergList"></div>
  </div>

  <div class="card">
    <h2><span class="num">5</span> Observaciones</h2>
    <textarea id="obs" placeholder="Notas adicionales para el siguiente turno (opcional)"></textarea>
  </div>

  <div class="card">
    <details>
      <summary>Ver vista previa del mensaje</summary>
      <div class="preview" id="preview"></div>
    </details>
  </div>

</div>

<div class="fab">
  <div class="inner">
    <button id="resetBtn" title="Limpiar">⟲</button>
    <button id="copyBtn">Copiar para WhatsApp</button>
  </div>
</div>
<div class="toast" id="toast">Copiado ✓</div>

<script>

let patients = [];

          <input class="nombre" type="text" placeholder="Nombre y apellido" value="${p.nombre.replace(/"/g,'&quot;')}" data-pi="${i}" data-pf="nombre">

      <button type="button" class="del" data-del="${i}" title="Quitar">×</button>`;

    b.onclick=()=>{ patients.splice(+b.dataset.del,1); renderPatients(); render(); };

}

function fmtDate(v){
  if(!v) return "__/__/__";
  const [y,m,d]=v.split('-');
  return `${d}/${m}/${y.slice(2)}`;
}

function buildMessage(){
  const DIV = "━━━━━━━━━━━━━━";
  const area = state.area || "( selecciona área )";
  const fecha = fmtDate(document.getElementById('fecha').value);
  const horario = state.horario || "—";

  const addUnit=(id,unit)=>{
    let v=document.getElementById(id).value.trim();
    if(!v) return '—';
    if(v.includes('°')||v.includes('%')||v.includes(',')||/[a-zA-Z]/.test(v)) return v;
    return v+unit;
  };

  let L=[];

  // Encabezado
  L.push(`🏥 *SERVICIO FARMACÉUTICO HEMA*`);
  L.push(DIV);
  L.push(`📌 *ENTREGA DE TURNO*`);
  L.push(`📍 Área: *${area}*`);
  L.push(`📅 ${fecha}   ⏰ ${horario}`);
  const entregaP=document.getElementById('entregaPersona').value.trim();
  if(entregaP) L.push(`👤 Entrega: *${entregaP}*`);
  L.push(DIV);

  // Cadena de frío (ocultar si todos los campos vacíos)
  const frioIds = ['tNevera','tNevera2','tNevera3','tArea','humedad'];
  const hayFrio = frioIds.some(id=>{
    const el=document.getElementById(id);
    return el && el.value.trim()!=='';
  });
  if(hayFrio){
    L.push(`❄️ *CADENA DE FRÍO*`);
    if(state.area==='Servicio Farmacéutico Central'){
      L.push(`Nevera Grande: *${addUnit('tNevera','°C')}*  ·  Nevera Central: *${addUnit('tNevera2','°C')}*`);
      L.push(`Nevera 3: *${addUnit('tNevera3','°C')}*  ·  Área: *${addUnit('tArea','°C')}*`);
    } else {
      L.push(`Nevera: *${addUnit('tNevera','°C')}*  ·  Área: *${addUnit('tArea','°C')}*`);
    }
    L.push(`Humedad: *${addUnit('humedad','%')}*`);
  }

  // Pacientes
  if(state.area==='Servicio Farmacéutico Central'){
    // sub-secciones por UCI / Hospitalización
    let anyPat=false;
    CENTRAL_SECS.forEach(sec=>{
      const arr=centralPats[sec.key].filter(p=>p.cama.trim()||p.nombre.trim());
      if(arr.length) anyPat=true;
    });
    if(anyPat){
      L.push(DIV);
      L.push(`👤 *PACIENTES*`);
      CENTRAL_SECS.forEach(sec=>{
        const arr=centralPats[sec.key].filter(p=>p.cama.trim()||p.nombre.trim());
        if(arr.length){
          L.push(`*▪️ ${sec.key.toUpperCase()}*`);
          arr.forEach(p=>{
            const cama=p.cama.trim();
            const nom=p.nombre.trim();
            const nota=p.nota.trim();
            let line = cama ? `${cama} · ${nom}` : `· ${nom}`;
            if(nota) line += ` \`${nota}\``;
            L.push(line);
          });
        }
      });
    }
  } else {
    const validPats = patients.filter(p=>p.cama.trim()||p.nombre.trim());
    if(validPats.length){
      L.push(DIV);
      L.push(`👤 *PACIENTES*`);
      validPats.forEach(p=>{
        const cama=p.cama.trim();
        const nom=p.nombre.trim();
        const nota=p.nota.trim();
        const status=(p.status||'').trim();
        const fact=(p.facturado||'').trim();
        let line = cama ? `${cama} · ${nom}` : `· ${nom}`;
        if(status) line += ` — ${status}`;
        if(fact) line += ` | Fact: ${fact}`;
        if(nota) line += ` \`${nota}\``;
        L.push(line);
      });
    }
  }

  // Novedades
  L.push(DIV);
  L.push(`📋 *NOVEDADES*`);

  const pa=state.prealta;
  const validPre = prealtas.filter(p=>p.cama.trim()||p.nombre.trim()||p.nota.trim());
  const cg=state.cargos;
  const validCargos = cargos.filter(c=>c.cama.trim()||c.nombre.trim()||c.medicacion.trim());
  const ev=state.event, evD=document.getElementById('eventDetalle').value.trim();

  const hayNovedad = (pa==='Sí') || (cg==='Sí') || (ev==='Sí');

  if(!hayNovedad){
    L.push(`Sin novedades`);
  } else {
    // Pre-alta (no realizar cargos)
    if(pa==='Sí' && validPre.length){
      L.push(`Pre-alta (no realizar cargos): *Sí*`);
      validPre.forEach(p=>{
        const cama=p.cama.trim();
        const nom=p.nombre.trim();
        const nota=p.nota.trim();
        let line = cama ? `${cama} · ${nom}` : `· ${nom}`;
        if(nota) line += ` \`${nota}\``;
        L.push(line);
      });
    } else if(pa==='Sí'){
      L.push(`Pre-alta (no realizar cargos): *Sí*`);
    }

    // Pendientes por cargos
    if(cg==='Sí' && validCargos.length){
      L.push(`Pendientes por cargos: *Sí*`);
      validCargos.forEach(c=>{
        const cama=c.cama.trim();
        const nom=c.nombre.trim();
        const med=c.medicacion.trim();
        let line = cama ? `${cama} · ${nom}` : `· ${nom}`;
        if(med) line += ` \`${med}\``;
        L.push(line);
      });
    } else if(cg==='Sí'){
      L.push(`Pendientes por cargos: *Sí*`);
    }

    // Eventualidades
    if(ev==='Sí'){
      L.push(`Eventualidades: *Sí* — ${evD||'—'}`);
    }
  }

  // Inventario Consignados (solo Cirugía) — ocultar si todo vacío
  if(state.area==='Cirugía'){
    const inputs=[...document.querySelectorAll('[data-inv]')];
    const hayAlgo=inputs.some(inp=>inp.value.trim()!=='');
    if(hayAlgo){
      L.push(DIV);
      L.push(`📦 *INVENTARIO CONSIGNADOS*`);
      inputs.forEach((inp,i)=>{
        const v=inp.value.trim();
        L.push(`${CONSIGNADOS[i]}: *${v===''?'0':v}*`);
      });
      L.push(`_Actualizado al ${fecha}_`);
    }
  }

  // Inventario Físico (según área) — ocultar si todo vacío
  if(INV_EMERG.length){
    const inputs=[...document.querySelectorAll('[data-invem]')];
    const hayAlgo=inputs.some(inp=>inp.value.trim()!=='');
    if(hayAlgo){
      L.push(DIV);
      L.push(`📦 *INVENTARIO FÍSICO*`);
      inputs.forEach((inp,i)=>{
        const v=inp.value.trim();
        L.push(`${INV_EMERG[i]}: *${v===''?'0':v}*`);
      });
      L.push(`_Actualizado al ${fecha}_`);
    }
  }

  // Observaciones
  const obs=document.getElementById('obs').value.trim();
  if(obs){
    L.push(DIV);
    L.push(`🗒️ *OBSERVACIONES*`);
    L.push(obs);
  }

  L.push(DIV);
  return L.join('\n');
}

// ---- copy
document.getElementById('copyBtn').onclick=async()=>{
  if(!state.area){ flash("Selecciona un área primero"); return; }
  const msg=buildMessage();
  try{ await navigator.clipboard.writeText(msg); }
  catch(e){
    const ta=document.createElement('textarea');ta.value=msg;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');ta.remove();
  }
  // Recordatorio de constancias (solo Cirugía y Emergencia)
  if(state.area==='Cirugía' || state.area==='Emergencia'){
    const facturados = patients.filter(p=>p.facturado==='Sí' && (p.cama.trim()||p.nombre.trim()));
    if(facturados.length){
      const lista = facturados.map(p=>p.cama.trim() ? `cama ${p.cama.trim()}` : p.nombre.trim()).join(', ');
      alert('📎 No olvides adjuntar en WhatsApp las constancias de facturación de:\n\n'+lista);
    }
  }
  flash("Copiado ✓  Pégalo en WhatsApp");
};

function flash(t){
  const el=document.getElementById('toast');
  el.textContent=t;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1900);
}

render();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrega de Turno · Farmacia</title>
<style>
  :root{
    --ink:#263340;
    --paper:#eceef1;
    --card:#ffffff;
    --line:#d3d8de;
    --accent:#2563a8;
    --accent-soft:#e2ebf5;
    --amber:#b8722a;
    --danger:#a8322d;
    --muted:#5c6570;
    --wa:#128c4b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    line-height:1.4;
    padding:0 0 120px;
  }
  header{
    background:var(--ink);
    color:var(--paper);
    padding:20px 18px 22px;
    border-bottom:3px solid var(--accent);
  }
  header .kicker{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#a8c2e0;
    margin:0 0 4px;
    font-weight:600;
  }
  header h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  header p{
    margin:6px 0 0;
    font-size:13px;
    color:#b7c4d3;
  }
  .wrap{max-width:620px;margin:0 auto;padding:16px 14px}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 14px;
    margin-bottom:14px;
  }
  .card h2{
    margin:0 0 12px;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  .card h2 .num{
    background:var(--accent);color:#fff;
    width:20px;height:20px;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    margin:0 0 5px;
  }
  .field{margin-bottom:12px}
  input[type=text],input[type=date],input[type=number],textarea,select{
    width:100%;
    font-size:16px;
    font-family:inherit;
    color:var(--ink);
    background:#f5f7f9;
    border:1px solid var(--line);
    border-radius:9px;
    padding:11px 12px;
    outline:none;
  }
  input:focus,textarea:focus,select:focus{
    border-color:var(--accent);
    background:#fff;
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  textarea{resize:vertical;min-height:44px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .seg{display:flex;flex-wrap:wrap;gap:7px}
  .seg button{
    flex:1 1 45%;
    font-size:13px;font-weight:600;
    padding:10px 8px;
    border:1px solid var(--line);
    background:#f5f7f9;color:var(--muted);
    border-radius:9px;cursor:pointer;
    transition:.12s;
  }
  .seg button.on{
    background:var(--accent);color:#fff;border-color:var(--accent);
  }
  .toggle{display:flex;gap:8px}
  .toggle button{
    flex:1;font-size:14px;font-weight:600;
    padding:10px;border:1px solid var(--line);
    background:#f5f7f9;color:var(--muted);
    border-radius:9px;cursor:pointer;
  }
  .toggle button.no{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .toggle button.yes{background:#f6e6df;color:var(--amber);border-color:var(--amber)}
  .hint{font-size:11px;color:var(--muted);margin:4px 0 0}
  .inv-item{
    display:flex;align-items:center;gap:10px;
    padding:7px 0;border-bottom:1px dashed var(--line);
  }
  .inv-item:last-child{border-bottom:none}
  .inv-item span{flex:1;font-size:13px;font-weight:500}
  .inv-item input{width:64px;text-align:center;padding:8px 4px}
  .hidden{display:none}
  .pat-row{
    display:flex;gap:8px;align-items:flex-start;
    padding:10px 0;border-bottom:1px dashed var(--line);
  }
  .pat-row:last-of-type{border-bottom:none}
  .pat-row .cama{flex:0 0 70px}
  .pat-row .nombre{flex:1}
  .pat-fields{flex:1;display:flex;flex-direction:column;gap:7px}
  .pat-top{display:flex;gap:8px}
  .pat-row .del{
    flex:0 0 34px;height:40px;border:1px solid var(--line);
    background:#f5f7f9;color:var(--danger);border-radius:9px;
    font-size:18px;cursor:pointer;line-height:1;
  }
  .add-btn{
    width:100%;margin-top:10px;padding:11px;
    border:1px dashed var(--accent);background:var(--accent-soft);
    color:var(--accent);font-weight:700;font-size:14px;
    border-radius:9px;cursor:pointer;
  }
  .pat-empty{font-size:13px;color:var(--muted);padding:6px 0}
  .fab{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(#eceef1cc,#eceef1);
    padding:12px 14px 16px;
    backdrop-filter:blur(4px);
  }
  .fab .inner{max-width:620px;margin:0 auto;display:flex;gap:10px}
  .fab button{
    flex:1;font-size:15px;font-weight:700;
    padding:15px;border-radius:12px;border:none;cursor:pointer;
  }
  #copyBtn{background:var(--wa);color:#fff}
  #resetBtn{flex:0 0 52px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:20px}
  .toast{
    position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;
    font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .preview{
    background:#263340;color:#d6e0ea;
    border-radius:12px;padding:14px;margin-top:4px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12.5px;white-space:pre-wrap;line-height:1.5;
    max-height:280px;overflow:auto;
  }
  details summary{
    cursor:pointer;font-size:12px;font-weight:700;color:var(--accent);
    letter-spacing:.08em;text-transform:uppercase;list-style:none;padding:4px 0;
  }
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸ ";}
  details[open] summary::before{content:"▾ ";}
</style>
</head>
<body>
<header>
  <p class="kicker">Servicio Farmacéutico Hema</p>
  <h1>Entrega de Turno</h1>
  <p>Llena los campos y genera el reporte para WhatsApp.</p>
</header>

<div class="wrap">

  <div class="card">
    <h2><span class="num">1</span> Área y turno</h2>
    <div class="field">
      <label>Farmacia / Área</label>
      <div class="seg" id="areaSeg">
        <button data-area="Emergencia">Emergencia</button>
        <button data-area="UCI Adulto">UCI Adulto</button>
        <button data-area="Cirugía">Cirugía</button>
        <button data-area="Servicio Farmacéutico Central">Serv. Farm. Central</button>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="fecha">
      </div>
      <div class="field">
        <label>Horario</label>
        <div class="toggle" id="horarioSeg">
          <button type="button" data-h="7:00am - 7:00pm">7am - 7pm</button>
          <button type="button" data-h="7:00pm - 7:00am">7pm - 7am</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2><span class="num">2</span> Cadena de frío</h2>
    <div class="row">
      <div class="field">
        <label id="lblNevera1">Nevera</label>
        <input type="text" id="tNevera" placeholder="4.8" inputmode="decimal">
      </div>
      <div class="field" id="fldNevera2" style="display:none">
        <label>Nevera Central</label>
        <input type="text" id="tNevera2" placeholder="4.9" inputmode="decimal">
      </div>
      <div class="field" id="fldNevera3" style="display:none">
        <label>Nevera 3</label>
        <input type="text" id="tNevera3" placeholder="5.0" inputmode="decimal">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Área °C</label>
        <input type="text" id="tArea" placeholder="21.4" inputmode="decimal">
      </div>
      <div class="field">
        <label>Humedad</label>
        <input type="text" id="humedad" placeholder="58" inputmode="decimal">
      </div>
    </div>
  </div>

  <div class="card" id="patCard">
    <h2><span class="num">3</span> Pacientes</h2>
    <div id="patList"></div>
    <button type="button" id="addPat" class="add-btn">+ Agregar paciente</button>
  </div>

  <div class="card">
    <h2><span class="num">4</span> Novedades</h2>
    <div class="field">
      <label>Pre-alta (no realizar cargos)</label>
      <div class="toggle" data-toggle="prealta">
        <button data-val="No" class="no">No</button>
        <button data-val="Sí">Sí</button>
      </div>
      <div id="prealtaBox" class="hidden">
        <div id="prealtaList"></div>
        <button type="button" id="addPrealta" class="add-btn">+ Agregar paciente</button>
      </div>
    </div>
    <div class="field">
      <label>Pendientes por cargos</label>
      <div class="toggle" data-toggle="cargos">
        <button data-val="No" class="no">No</button>
        <button data-val="Sí">Sí</button>
      </div>
      <div id="cargosBox" class="hidden">
        <div id="cargoList"></div>
        <button type="button" id="addCargo" class="add-btn">+ Agregar pendiente</button>
      </div>
    </div>
    <div class="field">
      <label>Eventualidades</label>
      <div class="toggle" data-toggle="event">
        <button data-val="No" class="no">No</button>
        <button data-val="Sí">Sí</button>
      </div>
      <textarea id="eventDetalle" class="hidden" placeholder="Detalle de la eventualidad..."></textarea>
    </div>
  </div>

  <div class="card" id="invCard">
    <h2><span class="num">6</span> Inventario Consignados <span style="color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0">· solo Cirugía</span></h2>
    <div id="invList"></div>
  </div>

  <div class="card" id="invEmergCard" style="display:none">
    <h2><span class="num">6</span> Inventario Físico</h2>
    <div id="invEmergList"></div>
  </div>

  <div class="card">
    <h2><span class="num">5</span> Observaciones</h2>
    <textarea id="obs" placeholder="Notas adicionales para el siguiente turno (opcional)"></textarea>
  </div>

  <div class="card">
    <details>
      <summary>Ver vista previa del mensaje</summary>
      <div class="preview" id="preview"></div>
    </details>
  </div>

</div>

<div class="fab">
  <div class="inner">
    <button id="resetBtn" title="Limpiar">⟲</button>
    <button id="copyBtn">Copiar para WhatsApp</button>
  </div>
</div>
<div class="toast" id="toast">Copiado ✓</div>

<script>
const CONSIGNADOS = [
  "TROCAR OPTICO 5/100MM","TROCAR OPTICO 11/100MM","TROCAR OPTICO 12/100MM",
  "TROCAR OPTICO 12/150MM","TROCAR BALON 5/100MM","TROCAR CORTANTE 15/100MM",
  "MALLA OPTILENE 15X15","MALLA OPTILENE 30X30","HISTOACRYL LAPFIX",
  "HISTOACRYL BLUE 0.5ML","CLIPS POLIMERO XL","CLIPS POLIMERO ML",
  "CLIPS POLIMERO L","ENDOBAG 200ML","DRENAJE TORACICO",
  "GRAPAS 4.8MM GRAPADORA LINEAL PANTHER",
  "PANTHER GRAPADORA CIRCULAR 32MM 5.0MM",
  "PANTHER GRAPADORA LINEAL 80MM 4.8MM"
];

const state = {
  area:"", horario:"", event:"No", cargos:"No", prealta:"No"
};
let patients = [];

// ---- build inventory rows
const invList = document.getElementById('invList');
CONSIGNADOS.forEach((name,i)=>{
  const row=document.createElement('div');
  row.className='inv-item';
  row.innerHTML=`<span>${name}</span><input type="number" inputmode="numeric" min="0" data-inv="${i}" placeholder="0">`;
  invList.appendChild(row);
});

// ---- inventario Físico (dinámico por área)
const INV_FIS_EMERG_UCI = [
  "Solución Salina 100","Solución Salina 250","Solución Salina 500",
  "Solución Salina 1000","Tramadol 50mg/ml"
];
const INV_FIS_CX_CENTRAL = [
  "Misoprostol 200mcg"
];
const INV_FIS_CX = [
  "Misoprostol 200mcg","Tramadol 50mg/ml"
];
let INV_EMERG = []; // lista activa según área
const invEmergList = document.getElementById('invEmergList');
function buildInvFisico(){
  invEmergList.innerHTML='';
  INV_EMERG.forEach((name,i)=>{
    const row=document.createElement('div');
    row.className='inv-item';
    row.innerHTML=`<span>${name}</span><input type="number" inputmode="numeric" min="0" data-invem="${i}" placeholder="0">`;
    invEmergList.appendChild(row);
  });
  // re-enganchar listener de render a los nuevos inputs
  invEmergList.querySelectorAll('input').forEach(el=>el.addEventListener('input',render));
}

// ---- patients
const patList=document.getElementById('patList');
function renderPatients(){
  patList.innerHTML='';
  if(patients.length===0){
    const e=document.createElement('div');
    e.className='pat-empty';
    e.textContent='Sin pacientes agregados.';
    patList.appendChild(e);
    return;
  }
  patients.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='pat-row';
    row.innerHTML=`
      <div class="pat-fields">
        <div class="pat-top">
          <input class="cama" type="text" inputmode="numeric" placeholder="Cama" value="${p.cama.replace(/"/g,'&quot;')}" data-pi="${i}" data-pf="cama">
          <input class="nombre" type="text" placeholder="Nombre y apellido" value="${p.nombre.replace(/"/g,'&quot;')}" data-pi="${i}" data-pf="nombre">
        </div>
        <input type="text" placeholder="Notas" value="${p.nota.replace(/"/g,'&quot;')}" data-pi="${i}" data-pf="nota">
      </div>
      <button type="button" class="del" data-del="${i}" title="Quitar">×</button>`;
    patList.appendChild(row);
  });
  patList.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const i=+e.target.dataset.pi, f=e.target.dataset.pf;
      patients[i][f]=e.target.value;
      render();
    });
  });
  patList.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick=()=>{ patients.splice(+b.dataset.del,1); renderPatients(); render(); };
  });
}
document.getElementById('addPat').onclick=()=>{
  patients.push({cama:'',nombre:'',nota:''});
  renderPatients(); render();
};
renderPatients();

// ---- pendientes por cargos (lista)
let cargos = [];
const cargoList=document.getElementById('cargoList');
function renderCargos(){
  cargoList.innerHTML='';
  if(cargos.length===0){
    const e=document.createElement('div');
    e.className='pat-empty';
    e.textContent='Sin pendientes agregados.';
    cargoList.appendChild(e);
    return;
  }
  cargos.forEach((c,i)=>{
    const row=document.createElement('div');
    row.className='pat-row';
    row.innerHTML=`
      <div class="pat-fields">
        <div class="pat-top">
          <input class="cama" type="text" inputmode="numeric" placeholder="Cama" value="${c.cama.replace(/"/g,'&quot;')}" data-ci="${i}" data-cf="cama">
          <input class="nombre" type="text" placeholder="Nombre del paciente" value="${c.nombre.replace(/"/g,'&quot;')}" data-ci="${i}" data-cf="nombre">
        </div>
        <input type="text" placeholder="Medicación" value="${c.medicacion.replace(/"/g,'&quot;')}" data-ci="${i}" data-cf="medicacion">
      </div>
      <button type="button" class="del" data-delc="${i}" title="Quitar">×</button>`;
    cargoList.appendChild(row);
  });
  cargoList.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const i=+e.target.dataset.ci, f=e.target.dataset.cf;
      cargos[i][f]=e.target.value;
      render();
    });
  });
  cargoList.querySelectorAll('[data-delc]').forEach(b=>{
    b.onclick=()=>{ cargos.splice(+b.dataset.delc,1); renderCargos(); render(); };
  });
}
document.getElementById('addCargo').onclick=()=>{
  cargos.push({cama:'',nombre:'',medicacion:''});
  renderCargos(); render();
};
renderCargos();

// ---- pre-alta (lista)
let prealtas = [];
const prealtaList=document.getElementById('prealtaList');
function renderPrealtas(){
  prealtaList.innerHTML='';
  if(prealtas.length===0){
    const e=document.createElement('div');
    e.className='pat-empty';
    e.textContent='Sin pacientes agregados.';
    prealtaList.appendChild(e);
    return;
  }
  prealtas.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='pat-row';
    row.innerHTML=`
      <div class="pat-fields">
        <div class="pat-top">
          <input class="cama" type="text" inputmode="numeric" placeholder="Cama" value="${p.cama.replace(/"/g,'&quot;')}" data-ai="${i}" data-af="cama">
          <input class="nombre" type="text" placeholder="Nombre" value="${p.nombre.replace(/"/g,'&quot;')}" data-ai="${i}" data-af="nombre">
        </div>
        <input type="text" placeholder="Notas" value="${p.nota.replace(/"/g,'&quot;')}" data-ai="${i}" data-af="nota">
      </div>
      <button type="button" class="del" data-dela="${i}" title="Quitar">×</button>`;
    prealtaList.appendChild(row);
  });
  prealtaList.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const i=+e.target.dataset.ai, f=e.target.dataset.af;
      prealtas[i][f]=e.target.value;
      render();
    });
  });
  prealtaList.querySelectorAll('[data-dela]').forEach(b=>{
    b.onclick=()=>{ prealtas.splice(+b.dataset.dela,1); renderPrealtas(); render(); };
  });
}
document.getElementById('addPrealta').onclick=()=>{
  prealtas.push({cama:'',nombre:'',nota:''});
  renderPrealtas(); render();
};
renderPrealtas();

// ---- horario selector
document.querySelectorAll('#horarioSeg button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#horarioSeg button').forEach(x=>x.classList.remove('no'));
    b.classList.add('no');
    state.horario=b.dataset.h;
    render();
  };
});

// ---- area selector
const invCard=document.getElementById('invCard');
document.querySelectorAll('#areaSeg button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#areaSeg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    state.area=b.dataset.area;
    const isCx = state.area==='Cirugía';
    invCard.classList.toggle('hidden',!isCx);
    // 3 neveras solo en Servicio Farmacéutico Central
    const isCentral = state.area==='Servicio Farmacéutico Central';
    document.getElementById('fldNevera2').style.display = isCentral ? '' : 'none';
    document.getElementById('fldNevera3').style.display = isCentral ? '' : 'none';
    document.getElementById('lblNevera1').textContent = isCentral ? 'Nevera Grande' : 'Nevera';
    // Inventario Físico: ítems según área
    const invCardFis = document.getElementById('invEmergCard');
    if(state.area==='Emergencia' || state.area==='UCI Adulto'){
      INV_EMERG = INV_FIS_EMERG_UCI;
      buildInvFisico(); invCardFis.style.display='';
    } else if(isCx){
      INV_EMERG = INV_FIS_CX;
      buildInvFisico(); invCardFis.style.display='';
    } else if(isCentral){
      INV_EMERG = INV_FIS_CX_CENTRAL;
      buildInvFisico(); invCardFis.style.display='';
    } else {
      INV_EMERG = [];
      buildInvFisico(); invCardFis.style.display='none';
    }
    render();
  };
});

// ---- toggles
document.querySelectorAll('[data-toggle]').forEach(group=>{
  const key=group.dataset.toggle;
  const map={event:'eventDetalle'};
  group.querySelectorAll('button').forEach(btn=>{
    btn.onclick=()=>{
      group.querySelectorAll('button').forEach(x=>{x.classList.remove('yes');x.classList.remove('no')});
      const val=btn.dataset.val;
      state[key]=val;
      const attention = (val==='Sí'||val==='Con novedad');
      btn.classList.add(attention?'yes':'no');
      if(key==='cargos'){
        document.getElementById('cargosBox').classList.toggle('hidden',!attention);
        if(!attention){ cargos.length=0; renderCargos(); }
      } else if(key==='prealta'){
        document.getElementById('prealtaBox').classList.toggle('hidden',!attention);
        if(!attention){ prealtas.length=0; renderPrealtas(); }
      } else {
        const detalle=document.getElementById(map[key]);
        detalle.classList.toggle('hidden',!attention);
        if(!attention) detalle.value='';
      }
      render();
    };
  });
});

// preselect defaults visually
document.querySelector('[data-toggle=event] [data-val="No"]').classList.add('no');
document.querySelector('[data-toggle=cargos] [data-val="No"]').classList.add('no');
document.querySelector('[data-toggle=prealta] [data-val="No"]').classList.add('no');

// default date = today
const t=new Date();
document.getElementById('fecha').value=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;

// ---- listeners for live preview
document.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',render));

function fmtDate(v){
  if(!v) return "__/__/__";
  const [y,m,d]=v.split('-');
  return `${d}/${m}/${y.slice(2)}`;
}

function buildMessage(){
  const DIV = "━━━━━━━━━━━━━━";
  const area = state.area || "( selecciona área )";
  const fecha = fmtDate(document.getElementById('fecha').value);
  const horario = state.horario || "—";

  const addUnit=(id,unit)=>{
    let v=document.getElementById(id).value.trim();
    if(!v) return '—';
    if(v.includes('°')||v.includes('%')||v.includes(',')||/[a-zA-Z]/.test(v)) return v;
    return v+unit;
  };

  let L=[];

  // Encabezado
  L.push(`🏥 *SERVICIO FARMACÉUTICO HEMA*`);
  L.push(DIV);
  L.push(`📌 *ENTREGA DE TURNO*`);
  L.push(`📍 Área: *${area}*`);
  L.push(`📅 ${fecha}   ⏰ ${horario}`);
  L.push(DIV);

  // Cadena de frío
  L.push(`❄️ *CADENA DE FRÍO*`);
  if(state.area==='Servicio Farmacéutico Central'){
    L.push(`Nevera Grande: *${addUnit('tNevera','°C')}*  ·  Nevera Central: *${addUnit('tNevera2','°C')}*`);
    L.push(`Nevera 3: *${addUnit('tNevera3','°C')}*  ·  Área: *${addUnit('tArea','°C')}*`);
  } else {
    L.push(`Nevera: *${addUnit('tNevera','°C')}*  ·  Área: *${addUnit('tArea','°C')}*`);
  }
  L.push(`Humedad: *${addUnit('humedad','%')}*`);

  // Pacientes
  const validPats = patients.filter(p=>p.cama.trim()||p.nombre.trim());
  if(validPats.length){
    L.push(DIV);
    L.push(`👤 *PACIENTES*`);
    validPats.forEach(p=>{
      const cama=p.cama.trim();
      const nom=p.nombre.trim();
      const nota=p.nota.trim();
      let line = cama ? `${cama} · ${nom}` : `· ${nom}`;
      if(nota) line += ` \`${nota}\``;
      L.push(line);
    });
  }

  // Novedades
  L.push(DIV);
  L.push(`📋 *NOVEDADES*`);

  const pa=state.prealta;
  const validPre = prealtas.filter(p=>p.cama.trim()||p.nombre.trim()||p.nota.trim());
  const cg=state.cargos;
  const validCargos = cargos.filter(c=>c.cama.trim()||c.nombre.trim()||c.medicacion.trim());
  const ev=state.event, evD=document.getElementById('eventDetalle').value.trim();

  const hayNovedad = (pa==='Sí') || (cg==='Sí') || (ev==='Sí');

  if(!hayNovedad){
    L.push(`Sin novedades`);
  } else {
    // Pre-alta (no realizar cargos)
    if(pa==='Sí' && validPre.length){
      L.push(`Pre-alta (no realizar cargos): *Sí*`);
      validPre.forEach(p=>{
        const cama=p.cama.trim();
        const nom=p.nombre.trim();
        const nota=p.nota.trim();
        let line = cama ? `${cama} · ${nom}` : `· ${nom}`;
        if(nota) line += ` \`${nota}\``;
        L.push(line);
      });
    } else if(pa==='Sí'){
      L.push(`Pre-alta (no realizar cargos): *Sí*`);
    }

    // Pendientes por cargos
    if(cg==='Sí' && validCargos.length){
      L.push(`Pendientes por cargos: *Sí*`);
      validCargos.forEach(c=>{
        const cama=c.cama.trim();
        const nom=c.nombre.trim();
        const med=c.medicacion.trim();
        let line = cama ? `${cama} · ${nom}` : `· ${nom}`;
        if(med) line += ` \`${med}\``;
        L.push(line);
      });
    } else if(cg==='Sí'){
      L.push(`Pendientes por cargos: *Sí*`);
    }

    // Eventualidades
    if(ev==='Sí'){
      L.push(`Eventualidades: *Sí* — ${evD||'—'}`);
    }
  }

  // Inventario (solo Cirugía)
  if(state.area==='Cirugía'){
    L.push(DIV);
    L.push(`📦 *INVENTARIO CONSIGNADOS*`);
    document.querySelectorAll('[data-inv]').forEach((inp,i)=>{
      const v=inp.value.trim();
      L.push(`${CONSIGNADOS[i]}: *${v===''?'0':v}*`);
    });
    L.push(`_Actualizado al ${fecha}_`);
  }

  // Inventario Físico (según área)
  if(INV_EMERG.length){
    L.push(DIV);
    L.push(`📦 *INVENTARIO FÍSICO*`);
    document.querySelectorAll('[data-invem]').forEach((inp,i)=>{
      const v=inp.value.trim();
      L.push(`${INV_EMERG[i]}: *${v===''?'0':v}*`);
    });
    L.push(`_Actualizado al ${fecha}_`);
  }

  // Observaciones
  const obs=document.getElementById('obs').value.trim();
  if(obs){
    L.push(DIV);
    L.push(`🗒️ *OBSERVACIONES*`);
    L.push(obs);
  }

  L.push(DIV);
  return L.join('\n');
}

function render(){ document.getElementById('preview').textContent=buildMessage(); }

// ---- copy
document.getElementById('copyBtn').onclick=async()=>{
  if(!state.area){ flash("Selecciona un área primero"); return; }
  const msg=buildMessage();
  try{ await navigator.clipboard.writeText(msg); }
  catch(e){
    const ta=document.createElement('textarea');ta.value=msg;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');ta.remove();
  }
  flash("Copiado ✓  Pégalo en WhatsApp");
};

document.getElementById('resetBtn').onclick=()=>{
  if(!confirm('¿Limpiar todo el formulario?')) return;
  location.reload();
};

function flash(t){
  const el=document.getElementById('toast');
  el.textContent=t;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1900);
}

render();
</script>
</body>
</html>
